spring.application.name=nexus-app
# nexus-app/src/main/resources/application-postgres.properties
spring.datasource.url=${NEXUS_DB_URL}
spring.datasource.username=${NEXUS_DB_USERNAME}
spring.datasource.password=${NEXUS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keeps existing data; use migrations for production schema changes.
spring.jpa.hibernate.ddl-auto=create-drop
#validate
spring.jpa.open-in-view=false

# Do not run H2 demo entries against a real vault.
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

